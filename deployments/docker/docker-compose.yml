version: "3.9"

networks:
  posnet:
    driver: bridge

volumes:
  postgres_data:
  nats_data:
  prometheus_data:
  grafana_data:

services:

  postgres:
    image: postgres:16-alpine
    container_name: posnet-postgres
    restart: unless-stopped
    networks: [posnet]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: posnet
      POSTGRES_PASSWORD: posnet123
      POSTGRES_DB: posnet
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posnet -d posnet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  nats:
    image: nats:2.10-alpine
    container_name: posnet-nats
    restart: unless-stopped
    networks: [posnet]
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "nats-server", "--help"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: posnet-jaeger
    restart: unless-stopped
    networks: [posnet]
    # Solo se expone la UI. El OTLP (4317/4318) queda interno en la red posnet
    # porque esos puertos del host ya los usa el otel-collector.
    ports:
      - "16686:16686"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    container_name: posnet-otel
    restart: unless-stopped
    networks: [posnet]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel-collector-config.yml:/etc/otel/config.yml
    command: ["--config=/etc/otel/config.yml"]
    depends_on:
      - jaeger

  acquirer-mock:
    image: mockserver/mockserver:5.15.0
    container_name: posnet-acquirer-mock
    restart: unless-stopped
    networks: [posnet]
    ports:
      - "9100:9100"
    environment:
      MOCKSERVER_SERVER_PORT: 9100

  webhook-mock:
    image: mockserver/mockserver:5.15.0
    container_name: posnet-webhook-mock
    restart: unless-stopped
    networks: [posnet]
    ports:
      - "9200:9200"
    environment:
      MOCKSERVER_SERVER_PORT: 9200

  authorization:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.authorization
      network: host
    container_name: posnet-authorization
    restart: unless-stopped
    networks: [posnet]
    ports:
      - "8080:8080"
      - "9090:9090"
    env_file: ../../.env.docker
    environment:
      HTTP_PORT: "8080"
      GRPC_PORT: "9090"
      OTEL_SERVICE_NAME: posnet-authorization
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  terminal-gateway:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.terminal-gateway
      network: host
    container_name: posnet-terminal-gateway
    restart: unless-stopped
    networks: [posnet]
    ports:
      - "8081:8081"
      - "8082:8082"
      - "9091:9091"
    env_file: ../../.env.docker
    environment:
      HTTP_PORT: "8081"
      WS_PORT: "8082"
      GRPC_PORT: "9091"
      OTEL_SERVICE_NAME: posnet-terminal-gateway
      POSNET_HOST: "192.168.0.2"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  fraud-detection:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.fraud-detection
      network: host
    container_name: posnet-fraud-detection
    restart: unless-stopped
    networks: [posnet]
    ports:
      - "8083:8083"
      - "9092:9092"
    env_file: ../../.env.docker
    environment:
      HTTP_PORT: "8083"
      GRPC_PORT: "9092"
      OTEL_SERVICE_NAME: posnet-fraud-detection
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8083/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  settlement:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.settlement
      network: host
    container_name: posnet-settlement
    restart: unless-stopped
    networks: [posnet]
    ports:
      - "8084:8084"
      - "9093:9093"
    env_file: ../../.env.docker
    environment:
      HTTP_PORT: "8084"
      GRPC_PORT: "9093"
      OTEL_SERVICE_NAME: posnet-settlement
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8084/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  notification:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.notification
      network: host
    container_name: posnet-notification
    restart: unless-stopped
    networks: [posnet]
    ports:
      - "8085:8085"
      - "9094:9094"
    env_file: ../../.env.docker
    environment:
      HTTP_PORT: "8085"
      GRPC_PORT: "9094"
      OTEL_SERVICE_NAME: posnet-notification
      TERMINAL_GATEWAY_GRPC_ADDR: terminal-gateway:9091
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      terminal-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8085/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: posnet-prometheus
    restart: unless-stopped
    networks: [posnet]
    # Host 9099 → 9090 interno. El 9090 del host ya lo usa el gRPC de authorization.
    ports:
      - "9099:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    depends_on:
      - authorization
      - terminal-gateway
      - fraud-detection
      - settlement
      - notification

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: posnet-alertmanager
    restart: unless-stopped
    networks: [posnet]
    # Host 9097 → 9093 interno. El 9093 del host ya lo usa el gRPC de settlement.
    ports:
      - "9097:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml

  grafana:
    image: grafana/grafana:10.4.0
    container_name: posnet-grafana
    restart: unless-stopped
    networks: [posnet]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
