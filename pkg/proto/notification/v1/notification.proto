syntax = "proto3";

package posnet.notification.v1;

option go_package = "github.com/juantevez/go-posnet/pkg/proto/notification/v1;notificationv1";

// NotificationService — consultas y operaciones sobre notificaciones.
service NotificationService {
  rpc GetNotificationStatus(GetNotificationStatusRequest) returns (GetNotificationStatusResponse);
  rpc RetryNotification(RetryNotificationRequest) returns (RetryNotificationResponse);
  rpc ListFailedWebhooks(ListFailedWebhooksRequest) returns (ListFailedWebhooksResponse);
}

// ─── GetNotificationStatus ────────────────────────────────────────────────────

message GetNotificationStatusRequest {
  string notification_id = 1;
  string transaction_id  = 2;
}

message GetNotificationStatusResponse {
  string               notification_id = 1;
  string               transaction_id  = 2;
  string               merchant_id     = 3;
  NotificationChannel  channel         = 4;
  NotificationState    state           = 5;
  int32                attempts        = 6;
  int32                max_attempts    = 7;
  repeated DeliveryAttempt history     = 8;
  string               created_at      = 9;  // RFC3339
  string               dispatched_at   = 10; // RFC3339
}

message DeliveryAttempt {
  int32  attempt_number = 1;
  bool   success        = 2;
  int32  http_status    = 3;
  string error_message  = 4;
  string attempted_at   = 5; // RFC3339
}

// ─── RetryNotification ───────────────────────────────────────────────────────

message RetryNotificationRequest {
  string notification_id = 1;
  string operator_id     = 2;
}

message RetryNotificationResponse {
  bool   accepted     = 1;
  string error_reason = 2;
}

// ─── ListFailedWebhooks ───────────────────────────────────────────────────────

message ListFailedWebhooksRequest {
  string merchant_id = 1;
  int32  page_size   = 2;
  string page_token  = 3;
}

message ListFailedWebhooksResponse {
  repeated FailedWebhookSummary webhooks = 1;
  string next_page_token = 2;
}

message FailedWebhookSummary {
  string            notification_id = 1;
  string            transaction_id  = 2;
  string            merchant_id     = 3;
  NotificationState state           = 4;
  int32             attempts        = 5;
  string            last_attempt_at = 6; // RFC3339
}

// ─── Enums ────────────────────────────────────────────────────────────────────

enum NotificationChannel {
  NOTIFICATION_CHANNEL_UNSPECIFIED        = 0;
  NOTIFICATION_CHANNEL_TERMINAL_WEBSOCKET = 1;
  NOTIFICATION_CHANNEL_WEBHOOK            = 2;
  NOTIFICATION_CHANNEL_EMAIL              = 3;
  NOTIFICATION_CHANNEL_SMS                = 4;
}

enum NotificationState {
  NOTIFICATION_STATE_UNSPECIFIED = 0;
  NOTIFICATION_STATE_PENDING     = 1;
  NOTIFICATION_STATE_SENT        = 2;
  NOTIFICATION_STATE_FAILED      = 3;
  NOTIFICATION_STATE_RETRYING    = 4;
  NOTIFICATION_STATE_DEAD        = 5;
}
